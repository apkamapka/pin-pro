<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="pin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef2f2"/>
      <stop offset="50%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6"/>
      <feOffset dx="0" dy="6" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.4"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Full bleed background, no rounding (Android applies mask) -->
  <rect width="512" height="512" fill="url(#bg)"/>

  <!-- Subtle map grid pattern -->
  <g opacity="0.18" stroke="#ffffff" stroke-width="1.5" fill="none">
    <path d="M 40 140 Q 200 110 350 160 T 480 200"/>
    <path d="M 30 240 Q 180 220 320 260 T 490 290"/>
    <path d="M 50 360 Q 200 340 340 380 T 490 410"/>
    <path d="M 130 40 Q 150 200 140 350 T 160 480"/>
    <path d="M 280 30 Q 300 200 290 360 T 310 490"/>
    <path d="M 420 50 Q 440 200 430 360 T 440 480"/>
  </g>

  <!-- Pin shape - sized to fit safe zone (80% inner = 410px diameter at 256 center) -->
  <g filter="url(#shadow)">
    <path
      d="M 256 138
         C 196 138 152 182 152 242
         C 152 310 256 414 256 414
         C 256 414 360 310 360 242
         C 360 182 316 138 256 138 Z"
      fill="url(#pin)"
      stroke="#ffffff"
      stroke-width="6"
    />
    <circle cx="256" cy="242" r="40" fill="#ffffff"/>
    <circle cx="256" cy="242" r="26" fill="#dc2626"/>
  </g>
</svg>
