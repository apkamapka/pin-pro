<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="pin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef2f2"/>
      <stop offset="50%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6"/>
      <feOffset dx="0" dy="6" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.4"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background rounded square -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>

  <!-- Subtle map grid pattern -->
  <g opacity="0.18" stroke="#ffffff" stroke-width="1.5" fill="none">
    <path d="M 60 140 Q 200 110 350 160 T 460 200"/>
    <path d="M 50 240 Q 180 220 320 260 T 470 290"/>
    <path d="M 70 360 Q 200 340 340 380 T 470 410"/>
    <path d="M 130 60 Q 150 200 140 350 T 160 460"/>
    <path d="M 280 50 Q 300 200 290 360 T 310 470"/>
    <path d="M 420 70 Q 440 200 430 360 T 440 460"/>
  </g>

  <!-- Pin shape -->
  <g filter="url(#shadow)">
    <path
      d="M 256 96
         C 184 96 130 150 130 222
         C 130 304 256 432 256 432
         C 256 432 382 304 382 222
         C 382 150 328 96 256 96 Z"
      fill="url(#pin)"
      stroke="#ffffff"
      stroke-width="6"
    />
    <!-- Pin inner circle -->
    <circle cx="256" cy="222" r="48" fill="#ffffff"/>
    <circle cx="256" cy="222" r="32" fill="#dc2626"/>
  </g>
</svg>
